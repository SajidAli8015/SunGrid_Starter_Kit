# Non-secret settings. Secrets and provider credentials come from environment variables
# (see .env.example). Environment variables win over values here.

llm:
  provider: azure_openai     # overridden by LLM_PROVIDER
  timeout_s: 30
  max_retries: 2
  temperature: 0
  # Per-role model (or Azure deployment) overrides. null = use the provider's default model.
  roles:
    classifier:
      model: null
    extractor:
      model: null
    answerer:
      model: null

categories:
  file: config/categories.yaml    # single source of truth for category names and descriptions

classifier:
  max_tokens: 200
  cache_dir: .cache/classify      # git-ignored; keyed by model, prompt hash and query

embedding:
  model: BAAI/bge-small-en-v1.5   # local fastembed (ONNX); independent of the chat provider

vector_store:
  path: .chroma                   # relative to the repo root; git-ignored
  collection: sungrid_kb

ingestion:
  docs_dir: docs
  manifest: config/doc_manifest.yaml
  max_chunk_tokens: 350           # approximate; larger sections split on paragraph/bullet boundaries

retrieval:
  top_k: 5
  classifier_min_conf: 0.6
  non_relevant_min_conf: 0.85
  # Set from `python -m sungrid_copilot.cli calibrate` on the dev set (see NOTES.md).
  fallback_margin: 0.04            # filtered top-1 must be within this of unfiltered top-1
  non_relevant_score_ceiling: 0.60 # decline non_relevant only if unfiltered top-1 is below this

messages:
  file: config/messages.yaml      # all fixed user-facing text

eligibility:
  # The Rooftop Rebate eligibility service, loaded by name. Called only through eligibility/adapter.py.
  service_module: stub_tools
  service_function: check_rebate_eligibility
  timeout_s: 5                    # single attempt, no retries
  extractor_max_tokens: 200
  cache_dir: .cache/extract       # git-ignored slot-extraction cache
  # After a decision, the KB is searched for what happens next. Plain questions, not doc names.
  next_steps:
    category: incentive_rebate
    focus: >-
      Explain only the process steps that follow for the member. Do not state any dollar amounts,
      any eligibility result, or whether the member qualifies.
    queries:
      ineligible: How can a member appeal a rebate eligibility determination, and within what time limit?
      eligible: What documents must a Rooftop Rebate applicant submit, and what happens when the program budget runs out?

answer:
  max_tokens: 600

agent:
  max_clarification_turns: 3
  # LLM caches store the member's text on disk; they are for tuning commands, not member sessions.
  use_llm_cache: false

logging:
  path: logs/queries.jsonl        # git-ignored; one JSON line per handled message
  include_query_text: false       # privacy default: log a SHA-256 hash and the length only

# USD per 1M tokens, keyed by provider then model/deployment. null = unknown, so cost is null.
pricing:
  azure_openai:
    gpt-4o:
      input_per_1m: null
      output_per_1m: null
