# Non-secret settings. Secrets and provider credentials come from environment variables
# (see .env.example). Environment variables win over values here.

llm:
  provider: azure_openai     # overridden by LLM_PROVIDER
  timeout_s: 30
  max_retries: 2
  temperature: 0
  # Per-role model (or Azure deployment) overrides. null = use the provider's default model.
  roles:
    classifier:
      model: null
    extractor:
      model: null
    answerer:
      model: null

embedding:
  model: BAAI/bge-small-en-v1.5   # local fastembed (ONNX); independent of the chat provider

vector_store:
  path: .chroma                   # relative to the repo root; git-ignored
  collection: sungrid_kb

ingestion:
  docs_dir: docs
  manifest: config/doc_manifest.yaml
  max_chunk_tokens: 350           # approximate; larger sections split on paragraph/bullet boundaries

retrieval:
  top_k: 5
  classifier_min_conf: 0.6
  non_relevant_min_conf: 0.85
  min_score: null            # calibrated once retrieval exists
