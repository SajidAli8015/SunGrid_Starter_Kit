# Development set: ONLY for tuning thresholds (`python -m sungrid_copilot.cli calibrate`).
# The held-out evaluation set is written separately; do not tune against it.
# expected_sources are doc file stems from config/doc_manifest.yaml (empty for out-of-scope).
queries:
  # --- billing_account -------------------------------------------------------------------
  - id: d01
    query: There's a new adjustment line on my bill every month since my rebate got clawed back. How many more months of this?
    expected_category: billing_account
    expected_sources: [06_ambiguous_rebate_billing_adjustments]
    expect_eligibility_check: false
    tags: [reversal, billing_wording]
  - id: d02
    query: Why is my bill higher than normal? It mentions some kind of rebate adjustment.
    expected_category: billing_account
    expected_sources: [06_ambiguous_rebate_billing_adjustments]
    expect_eligibility_check: false
    tags: [reversal, billing_wording]
  - id: d03
    query: My card expired and the automatic payment bounced. Am I going to get hit with late fees or lose service?
    expected_category: billing_account
    expected_sources: [12_autopay_failure_policy, 03_billing_faqs]
    expect_eligibility_check: false
    tags: [autopay]
  - id: d04
    query: What happens in March if my house used more electricity over the year than the panels produced?
    expected_category: billing_account
    expected_sources: [11_net_metering_trueup, 03_billing_faqs]
    expect_eligibility_check: false
    tags: [true_up]
  - id: d05
    query: I keep seeing 15, 30 and 60 days in your policies. How long do I have to dispute a charge on my bill, and is that different from appealing a rebate decision?
    expected_category: billing_account
    expected_sources: [03_billing_faqs, 02_incentive_rebate_programs]
    expect_eligibility_check: false
    tags: [deadlines, multi_doc, ambiguous_category]

  # --- incentive_rebate ------------------------------------------------------------------
  - id: d06
    query: SunGrid says my rebate is being reversed because my installer wasn't approved. Can I fight that decision?
    expected_category: incentive_rebate
    expected_sources: [06_ambiguous_rebate_billing_adjustments, 02_incentive_rebate_programs]
    expect_eligibility_check: false
    tags: [reversal, rebate_wording]
  - id: d07
    query: I got a letter saying my solar rebate was approved by mistake and they want the money back. How does paying it back work?
    expected_category: incentive_rebate
    expected_sources: [06_ambiguous_rebate_billing_adjustments]
    expect_eligibility_check: false
    tags: [reversal, rebate_wording]
  - id: d08
    query: Do I qualify for the rooftop rebate? I live in 94103, make about $85k a year and I'm getting a 6 kW system put in.
    expected_category: incentive_rebate
    expected_sources: [02_incentive_rebate_programs]
    expect_eligibility_check: true
    tags: [eligibility]
  - id: d09
    query: How much of a rebate would I get back on my 8kW panels?
    expected_category: incentive_rebate
    expected_sources: [02_incentive_rebate_programs]
    expect_eligibility_check: true
    tags: [eligibility, missing_slots]
  - id: d10
    query: My installer's certification lapsed for a few weeks right when they did my install. Does that mess up my rebate?
    expected_category: incentive_rebate
    expected_sources: [07_installer_certification, 02_incentive_rebate_programs]
    expect_eligibility_check: false
    tags: [multi_doc, installer]
  - id: d11
    query: Can I still get the battery incentive if I'm only adding a battery and not putting up solar panels?
    expected_category: incentive_rebate
    expected_sources: [09_battery_storage_incentive]
    expect_eligibility_check: false
    tags: [battery, not_rooftop_rebate]
  - id: d29  # added after the review of 6619e93 (F1): eligibility question with a lapse during the install
    query: Am I eligible for the rooftop rebate? Household tier, ZIP 94103, about $85k a year, 6 kW. The installer company is SunGrid-approved, but the electrician's certification had lapsed when they did our install.
    expected_category: incentive_rebate
    expected_sources: [07_installer_certification, 02_incentive_rebate_programs]
    expect_eligibility_check: true
    tags: [eligibility, installer, lapse, mixed]

